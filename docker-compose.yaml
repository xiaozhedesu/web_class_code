services:

  # PostgreSQL 数据库服务
  postgres:
    image: postgres:16-alpine
    container_name: csm-postgres
    environment:
      POSTGRES_DB: cloud_server
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d cloud_server"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis服务
  redis:
    image: redis:7.4-alpine
    container_name: csm-redis
    volumes:
      - redisdata:/data
    restart: always
    environment:
      - TZ=Asia/Shanghai
    command: ['redis-server','--appendonly', 'yes']
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 3s
      retries: 5

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: csm-nacos
    environment:
      MODE: standalone
      # 开启鉴权
      NACOS_AUTH_ENABLE: "true"
      # 鉴权相关密钥
      NACOS_AUTH_TOKEN: -SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: -serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: -security
      TIME_ZONE: Asia/Shanghai
    ports:
      - "10086:8080"    # Nacos 控制台端口映射
      - "8848:8848"    # Nacos 服务端口映射
      - "9848:9848"    # Nacos gRPC 端口映射

  # 后端服务
  backend:
    build: ./shiny-cloud-backend/service
    container_name: csm-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: cloud_server
      DB_USERNAME: root
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379

  # 前端服务
  frontend:
    build: ./shiny-cloud-frontend
    container_name: csm-frontend
    depends_on:
      - backend
    ports:
      - target: 80
        published: 80

volumes:
  pgdata:
  redisdata: