spring:
  application:
    name: user-service

  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloud_server}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:postgres}

# mybatis-plus 配置应当是顶级配置，不在 spring 下！
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: club.xiaozhe.shinycloud
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      table-prefix: t_    # 适配表名用t_开头