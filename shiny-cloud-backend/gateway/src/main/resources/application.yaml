spring:
  application:
    name: gateway

  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**,/api/user/**
            # 目前未做项目分离，将所有路径都发往service
            - id: service
              uri: lb://service
              predicates:
                - Path=/**
